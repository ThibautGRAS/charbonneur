name: Lint articles
on:
  push:
    paths: ["data/articles.js", "scripts/lint-articles.js"]
permissions: { contents: read }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/lint-articles.js
