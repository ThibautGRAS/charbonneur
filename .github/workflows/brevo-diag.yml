name: Brevo diagnostic
on:
  workflow_dispatch:
    inputs:
      export_to:
        description: "Envoyer la liste complète des inscrits à cette adresse (vide = simple diagnostic masqué)"
        required: false
        default: ""
permissions: { contents: read }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          SENDER_EMAIL: ${{ vars.SENDER_EMAIL }}
          EXPORT_TO: ${{ github.event.inputs.export_to }}
        run: |
          if [ -n "$EXPORT_TO" ]; then node scripts/brevo-export.js; else node scripts/brevo-diag.js; fi
